<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Na Daloni — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --charcoal:#2B2620; --charcoal-soft:#5B5040; --paper:#FBF8F3; --panel:#FFFFFF;
  --line:#E6DDC8; --gold:#B8874B; --gold-deep:#8F6A38; --gold-tint:#F1E4CD;
  --sage:#5E7D5A; --sage-tint:#E7EFE3; --rust:#B5643C; --rust-tint:#F5E4D6;
  --red:#A8503F; --red-tint:#F3E0DA; --muted:#8A8070;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#FBF8F3; --panel:#FFFFFF; } }
*{box-sizing:border-box;}
html,body{height:100%;margin:0;background:var(--paper);}
body{font-family:'Inter',-apple-system,sans-serif;color:var(--charcoal);font-size:14px;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:600;margin:0;color:var(--charcoal);}
button{font-family:inherit;cursor:pointer;}
table{border-collapse:collapse;width:100%;}
.app{display:flex;min-height:100vh;}

/* Sidebar */
.sidebar{width:236px;flex:none;background:var(--charcoal);color:#EDE7DA;display:flex;flex-direction:column;padding:22px 14px;position:sticky;top:0;height:100vh;}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:14px;}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;color:var(--charcoal);font-size:16px;}
.brand-text .t1{font-family:'Fraunces',serif;font-size:16px;font-weight:600;color:#fff;line-height:1.1;}
.brand-text .t2{font-size:11px;color:#B9AF9A;margin-top:1px;}
nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;color:#CFC7B4;text-decoration:none;font-size:13.5px;border:none;background:none;width:100%;text-align:left;transition:background .12s ease;}
.nav-item svg{width:16px;height:16px;flex:none;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:rgba(184,135,75,.18);color:#fff;position:relative;}
.nav-item.active::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;background:var(--gold);border-radius:2px;}
.nav-group-label{font-size:10.5px;color:#8A8069;letter-spacing:.03em;margin:14px 10px 4px;}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:9px;}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--gold-tint);color:var(--gold-deep);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none;}
.sidebar-foot .name{font-size:13px;color:#fff;}
.sidebar-foot .role{font-size:11px;color:#9C9380;}

/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:14px 28px;background:var(--paper);border-bottom:1px solid var(--line);padding-top:calc(14px + env(safe-area-inset-top,0px));}
.search{flex:1;max-width:360px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px 12px;color:var(--muted);}
.search svg{width:15px;height:15px;flex:none;}
.search input{border:none;background:none;outline:none;font-size:13px;flex:1;color:var(--charcoal);font-family:inherit;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:16px;}
.icon-btn{width:34px;height:34px;border-radius:7px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;color:var(--charcoal-soft);position:relative;}
.icon-btn svg{width:16px;height:16px;}
.dot{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--rust);}

.content{padding:26px 28px 60px;flex:1;}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;gap:16px;flex-wrap:wrap;}
.page-head h1{font-size:24px;}
.page-head p{margin:6px 0 0;color:var(--charcoal-soft);font-size:13.5px;max-width:520px;}
.btn{border-radius:7px;padding:9px 16px;font-size:13.5px;font-weight:600;border:1px solid transparent;}
.btn-primary{background:var(--gold);color:#fff;}
.btn-primary:hover{background:var(--gold-deep);}
.btn-ghost{background:var(--panel);border:1px solid var(--line);color:var(--charcoal);}

.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;}
.kpi .label{font-size:12px;color:var(--charcoal-soft);}
.kpi .value{font-family:'Fraunces',serif;font-size:28px;margin-top:6px;font-variant-numeric:tabular-nums;}
.kpi .delta{font-size:12px;margin-top:4px;color:var(--sage);}
.kpi .delta.warn{color:var(--rust);}

.split{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start;}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);}
.panel-head h3{font-size:15.5px;}
.panel-head .link{font-size:12.5px;color:var(--gold-deep);font-weight:600;background:none;border:none;padding:0;}
.panel-body{padding:6px 0;}

table th{text-align:left;font-size:11.5px;color:var(--charcoal-soft);font-weight:600;padding:8px 18px;border-bottom:1px solid var(--line);white-space:nowrap;}
table td{padding:11px 18px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle;}
table tr:last-child td{border-bottom:none;}
table tr:hover td{background:#FAF6EE;}
.cell-primary{font-weight:600;color:var(--charcoal);}
.cell-sub{font-size:11.5px;color:var(--muted);margin-top:1px;}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;}
.pill.pending{background:var(--rust-tint);color:var(--rust);}
.pill.approved,.pill.active,.pill.confirmed,.pill.paid{background:var(--sage-tint);color:var(--sage);}
.pill.rejected,.pill.flagged,.pill.failed,.pill.hidden{background:var(--red-tint);color:var(--red);}
.pill.refunded{background:#EFE7D8;color:var(--muted);}
.row-actions{display:flex;gap:6px;}
.row-actions button{border-radius:6px;padding:5px 10px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--charcoal-soft);}
.row-actions button.approve{border-color:var(--sage);color:var(--sage);}
.row-actions button.reject{border-color:var(--red);color:var(--red);}

.feed{list-style:none;margin:0;padding:6px 0;}
.feed li{display:flex;gap:10px;padding:11px 18px;border-bottom:1px solid var(--line);}
.feed li:last-child{border-bottom:none;}
.feed .dot2{width:7px;height:7px;border-radius:50%;background:var(--gold);margin-top:6px;flex:none;}
.feed .txt{font-size:13px;line-height:1.45;}
.feed .txt b{font-weight:600;}
.feed .time{font-size:11px;color:var(--muted);margin-top:2px;}

.bars{display:flex;align-items:flex-end;gap:14px;height:140px;padding:18px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:8px;}
.bar-col .bar{width:100%;max-width:34px;background:var(--gold);border-radius:4px 4px 0 0;}
.bar-col .lbl{font-size:11px;color:var(--charcoal-soft);text-align:center;}

.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.chip{padding:7px 13px;border-radius:20px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;color:var(--charcoal-soft);}
.chip.active{background:var(--charcoal);color:#fff;border-color:var(--charcoal);}

.content-list{display:flex;flex-direction:column;gap:10px;}
.content-block{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;}
.content-block .swatch{width:44px;height:44px;border-radius:6px;flex:none;}
.content-block .info b{font-size:13.5px;display:block;}
.content-block .info span{font-size:12px;color:var(--muted);}
.content-block .grip{margin-left:auto;color:var(--muted);}

@media (max-width: 880px){
  .sidebar{position:fixed;left:-236px;z-index:20;transition:left .2s;}
  .sidebar.open{left:0;}
  .kpi-row{grid-template-columns:repeat(2,1fr);}
  .split{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">N</div>
      <div class="brand-text"><div class="t1">Na Daloni</div><div class="t2">Admin</div></div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <div class="avatar">AK</div>
      <div><div class="name">Alena K.</div><div class="role">Administrator</div></div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="icon-btn" onclick="document.getElementById('sidebar').classList.toggle('open')" style="display:none" id="burger"></button>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input placeholder="Search members, merchants, offers…">
      </div>
      <div class="topbar-right">
        <button class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="dot"></span></button>
        <button class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 0 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 0 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg></button>
      </div>
    </div>
    <main class="content" id="view"></main>
  </div>
</div>

<script>
const ICONS = {
  overview:'<path d="M3 12l2-2m0 0 7-7 7 7M5 10v10a1 1 0 0 0 1 1h3v-6h6v6h3a1 1 0 0 0 1-1V10"/>',
  merchants:'<path d="M3 21h18M4 21V9l8-6 8 6v12M9 21v-6h6v6"/>',
  offers:'<path d="M20.6 12.3 12.3 20.6a2 2 0 0 1-2.8 0l-7-7a2 2 0 0 1 0-2.8L10.8 2.5A2 2 0 0 1 12.3 2H19a2 2 0 0 1 2 2v6.8a2 2 0 0 1-.4 1.5Z"/><circle cx="15.5" cy="7.5" r="1.5"/>',
  customers:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><circle cx="17" cy="7" r="2.5"/><path d="M15.5 13.2c2.7.5 4.5 2.7 4.5 5.8"/>',
  payments:'<rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19"/>',
  redemptions:'<path d="M4 4h4v4H4zM16 4h4v4h-4zM4 16h4v4H4z"/><path d="M11 4h1v3M15 8h-2M20 12h-5v5M20 16h-3M11 12h3v3h-3z"/>',
  categories:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  reports:'<path d="M4 19V10M11 19V5M18 19v-7"/><path d="M2 19h20"/>',
  content:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5"/>',
  audit:'<path d="M9 3h6l1 4H8l1-4Z"/><path d="M6 7h12l1 13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1L6 7Z"/><path d="M9 12h6M9 16h6"/>',
};
function icon(name){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;}

const NAV = [
  {id:'overview', label:'Overview'},
  {group:'Marketplace'},
  {id:'merchants', label:'Merchants'},
  {id:'offers', label:'Offers'},
  {id:'categories', label:'Categories'},
  {group:'Members'},
  {id:'customers', label:'Customer accounts'},
  {id:'payments', label:'Membership & payments'},
  {id:'redemptions', label:'Redemptions'},
  {group:'Operations'},
  {id:'reports', label:'Reports'},
  {id:'content', label:'Homepage & content'},
  {id:'audit', label:'Audit log'},
];

function pill(status){return `<span class="pill ${status.toLowerCase()}">${status}</span>`;}

function table(columns, rows){
  return `<table><thead><tr>${columns.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>
  ${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}
  </tbody></table>`;
}

function primarySub(main, sub){return `<span class="cell-primary">${main}</span><div class="cell-sub">${sub}</div>`;}
function approveReject(){return `<div class="row-actions"><button class="approve">Approve</button><button class="reject">Reject</button></div>`;}

const DATA = {
merchants: [
 [primarySub('Belaya Vezha Spa','Beauty · 1 location'), 'Sep 24, 2026', pill('Pending'), approveReject()],
 [primarySub('Grand Minsk Cinema','Entertainment · 3 locations'), 'Sep 24, 2026', pill('Pending'), approveReject()],
 [primarySub('Verjbolovo Bistro','Dining · 1 location'), 'Sep 23, 2026', pill('Pending'), approveReject()],
 [primarySub('Fitness Loft','Fitness · 2 locations'), 'Sep 21, 2026', pill('Approved'), '<div class="row-actions"><button>View</button></div>'],
 [primarySub('Naliby Resort','Tourism · 1 location'), 'Sep 20, 2026', pill('Approved'), '<div class="row-actions"><button>View</button></div>'],
 [primarySub('Studio Char Hair','Beauty · 1 location'), 'Sep 18, 2026', pill('Rejected'), '<div class="row-actions"><button>View</button></div>'],
],
offers: [
 [primarySub('2-for-1 Tasting Menu','Verjbolovo Bistro · Dining'), 'Sep 25, 2026', pill('Pending'), approveReject()],
 [primarySub('50% Off Spa Day','Belaya Vezha Spa · Beauty'), 'Sep 24, 2026', pill('Pending'), approveReject()],
 [primarySub('2-for-1 Evening Screening','Grand Minsk Cinema · Entertainment'), 'Sep 23, 2026', pill('Pending'), approveReject()],
 [primarySub('Family Weekend Pass','Naliby Resort · Tourism'), 'Sep 20, 2026', pill('Approved'), '<div class="row-actions"><button>View</button></div>'],
 [primarySub('Buy 1 Get 1 Class Pack','Fitness Loft · Fitness'), 'Sep 19, 2026', pill('Approved'), '<div class="row-actions"><button>View</button></div>'],
],
customers: [
 [primarySub('Ihar Sakalouski','ihar.s@mail.by'), 'Annual', 'Aug 2, 2026', pill('Active')],
 [primarySub('Volha Rusak','volha.rusak@mail.by'), 'Monthly', 'Sep 14, 2026', pill('Active')],
 [primarySub('Siarhei Bandarenka','s.bandarenka@mail.by'), 'Monthly', 'Sep 22, 2026', pill('Active')],
 [primarySub('Katsiaryna Yasko','k.yasko@mail.by'), 'Annual', 'Jun 30, 2026', pill('Active')],
 [primarySub('Dzmitry Korzun','d.korzun@mail.by'), 'Monthly', 'Jul 11, 2026', pill('Active')],
],
payments: [
 [primarySub('Ihar Sakalouski','Annual plan'), 'BYN 240.00', 'Sep 2, 2026', pill('Paid')],
 [primarySub('Volha Rusak','Monthly plan'), 'BYN 28.00', 'Sep 14, 2026', pill('Paid')],
 [primarySub('Siarhei Bandarenka','Monthly plan'), 'BYN 28.00', 'Sep 22, 2026', pill('Failed')],
 [primarySub('Katsiaryna Yasko','Annual plan'), 'BYN 240.00', 'Jun 30, 2026', pill('Refunded')],
],
redemptions: [
 ['#RD-10482', primarySub('Ihar Sakalouski','Verjbolovo Bistro'), 'QR', 'Today, 13:42', pill('Confirmed')],
 ['#RD-10481', primarySub('Volha Rusak','Belaya Vezha Spa'), 'PIN', 'Today, 12:10', pill('Confirmed')],
 ['#RD-10480', primarySub('Dzmitry Korzun','Fitness Loft'), 'QR', 'Today, 11:55', pill('Flagged')],
 ['#RD-10479', primarySub('Katsiaryna Yasko','Grand Minsk Cinema'), 'QR', 'Today, 10:20', pill('Confirmed')],
 ['#RD-10478', primarySub('Siarhei Bandarenka','Naliby Resort'), 'PIN', 'Yesterday, 18:05', pill('Confirmed')],
],
audit: [
 ['Sep 25, 09:14', 'Alena K.', 'Approved offer', '2-for-1 Tasting Menu'],
 ['Sep 25, 08:50', 'Alena K.', 'Approved merchant', 'Fitness Loft'],
 ['Sep 24, 17:30', 'Pavel R.', 'Rejected merchant', 'Studio Char Hair'],
 ['Sep 24, 16:02', 'Alena K.', 'Edited category', 'Tourism'],
 ['Sep 23, 11:40', 'Pavel R.', 'Flagged redemption', '#RD-10480'],
],
};

function viewOverview(){
  return `
  <div class="page-head">
    <div><h1>Overview</h1><p>Marketplace activity and approvals across Minsk since launch.</p></div>
    <button class="btn btn-primary">Export report</button>
  </div>
  <div class="kpi-row">
    <div class="kpi"><div class="label">Pending merchant approvals</div><div class="value">6</div><div class="delta warn">3 new today</div></div>
    <div class="kpi"><div class="label">Pending offer approvals</div><div class="value">14</div><div class="delta warn">5 new today</div></div>
    <div class="kpi"><div class="label">Redemptions today</div><div class="value">182</div><div class="delta">+12% vs yesterday</div></div>
    <div class="kpi"><div class="label">Active members</div><div class="value">3,240</div><div class="delta">+48 this week</div></div>
  </div>
  <div class="split">
    <div class="panel">
      <div class="panel-head"><h3>Approval queue</h3><button class="link" onclick="go('merchants')">View all</button></div>
      <div class="panel-body">${table(['Merchant / Offer','Submitted','Status',''], [
        [primarySub('Belaya Vezha Spa','Merchant · Beauty'), 'Sep 24, 2026', pill('Pending'), approveReject()],
        [primarySub('2-for-1 Tasting Menu','Offer · Verjbolovo Bistro'), 'Sep 25, 2026', pill('Pending'), approveReject()],
        [primarySub('Grand Minsk Cinema','Merchant · Entertainment'), 'Sep 24, 2026', pill('Pending'), approveReject()],
        [primarySub('50% Off Spa Day','Offer · Belaya Vezha Spa'), 'Sep 24, 2026', pill('Pending'), approveReject()],
      ])}</div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Recent redemptions</h3><button class="link" onclick="go('redemptions')">View all</button></div>
      <ul class="feed">
        <li><div class="dot2"></div><div class="txt"><b>Ihar Sakalouski</b> redeemed at Verjbolovo Bistro<div class="time">Today, 13:42 · QR</div></div></li>
        <li><div class="dot2"></div><div class="txt"><b>Volha Rusak</b> redeemed at Belaya Vezha Spa<div class="time">Today, 12:10 · PIN</div></div></li>
        <li><div class="dot2"></div><div class="txt"><b>Dzmitry Korzun</b> redemption flagged at Fitness Loft<div class="time">Today, 11:55 · QR</div></div></li>
        <li><div class="dot2"></div><div class="txt"><b>Katsiaryna Yasko</b> redeemed at Grand Minsk Cinema<div class="time">Today, 10:20 · QR</div></div></li>
        <li><div class="dot2"></div><div class="txt"><b>Siarhei Bandarenka</b> redeemed at Naliby Resort<div class="time">Yesterday, 18:05 · PIN</div></div></li>
      </ul>
    </div>
  </div>`;
}

function viewTable(title, sub, columns, rowsKey, filters){
  const chips = (filters||['All','Pending','Approved','Rejected']).map((f,i)=>`<div class="chip ${i===0?'active':''}">${f}</div>`).join('');
  return `
  <div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div><button class="btn btn-primary">${title.includes('Categor')?'Add category':title.includes('Content')?'Add block':'Add new'}</button></div>
  <div class="filters">${chips}</div>
  <div class="panel"><div class="panel-body">${table(columns, DATA[rowsKey])}</div></div>`;
}

function viewCategories(){
  const rows = [
    ['Dining','Restaurants, cafés, bars, fine dining','142', pill('Active')],
    ['Beauty','Spa, hairdresser, beauty services, make-up','88', pill('Active')],
    ['Fitness','Gyms, yoga, Pilates, sports','54', pill('Active')],
    ['Entertainment','Cinema, theatre, concerts, activities','61', pill('Active')],
    ['Family Activities','Family-oriented experiences','29', pill('Active')],
    ['Tourism','Hotels, resorts, staycations, tours, museums','47', pill('Active')],
  ];
  return `
  <div class="page-head"><div><h1>Categories</h1><p>The six primary discovery categories shown in the customer app.</p></div><button class="btn btn-primary">Add category</button></div>
  <div class="panel"><div class="panel-body">${table(['Category','Includes','Active offers','Status'], rows)}</div></div>`;
}

function viewReports(){
  const bars = [['Dining',92],['Beauty',64],['Fitness',48],['Entertainment',71],['Family',35],['Tourism',58]];
  return `
  <div class="page-head"><div><h1>Reports</h1><p>Basic reporting across merchants, redemptions, customers, and savings.</p></div><button class="btn btn-primary">Export report</button></div>
  <div class="kpi-row">
    <div class="kpi"><div class="label">Total redemptions (30d)</div><div class="value">4,860</div></div>
    <div class="kpi"><div class="label">Member savings (30d)</div><div class="value">BYN 96,400</div></div>
    <div class="kpi"><div class="label">Commission recorded (30d)</div><div class="value">BYN 11,220</div></div>
    <div class="kpi"><div class="label">New members (30d)</div><div class="value">312</div></div>
  </div>
  <div class="panel">
    <div class="panel-head"><h3>Redemptions by category</h3></div>
    <div class="bars">${bars.map(b=>`<div class="bar-col"><div class="bar" style="height:${b[1]}%"></div><div class="lbl">${b[0]}</div></div>`).join('')}</div>
  </div>`;
}

function viewContent(){
  const blocks = [
    ['#B8874B','Discover Belarus','Iconic Belarus & Heritage, Hidden Gems, Adventure & Leisure, Hustle Escape, Social Events'],
    ['#5E7D5A','Just the Two of Us','Romantic Evening, Spa & Wellness, Getaways, Things to Do'],
    ['#B5643C','Featured item','Homepage hero placement, rotates weekly'],
    ['#2B2620','HOT OFFERS placements','Merchant-paid promotional slots, pending approval: 3'],
  ];
  return `
  <div class="page-head"><div><h1>Homepage & content</h1><p>Manage discovery content, the featured item, and HOT OFFERS placement.</p></div><button class="btn btn-primary">Add block</button></div>
  <div class="content-list">${blocks.map(b=>`<div class="content-block"><div class="swatch" style="background:${b[0]}"></div><div class="info"><b>${b[1]}</b><span>${b[2]}</span></div><div class="grip">⠿</div></div>`).join('')}</div>`;
}

const VIEWS = {
  overview: viewOverview,
  merchants: ()=>viewTable('Merchants','Approve, manage, and review merchant accounts.',['Business','Submitted','Status',''],'merchants'),
  offers: ()=>viewTable('Offers','Review and publish offers submitted by merchants.',['Offer','Submitted','Status',''],'offers',['All','Pending','Approved']),
  categories: viewCategories,
  customers: ()=>viewTable('Customer accounts','Search and manage member accounts.',['Member','Plan','Joined','Status'],'customers',['All','Active','Suspended']),
  payments: ()=>viewTable('Membership & payments','Membership and payment-related records.',['Member','Amount','Date','Status'],'payments',['All','Paid','Failed','Refunded']),
  redemptions: ()=>viewTable('Redemptions','Monitor redemption activity across all merchants.',['ID','Member / Merchant','Method','Time','Status'],'redemptions',['All','Confirmed','Flagged']),
  reports: viewReports,
  content: viewContent,
  audit: ()=>viewTable('Audit log','A record of approvals, offers, and redemption activity.',['Timestamp','Actor','Action','Entity'],'audit',['All','Approvals','Edits']),
};

function go(id){
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active', el.dataset.id===id));
  document.getElementById('view').innerHTML = VIEWS[id]();
  document.getElementById('sidebar').classList.remove('open');
  window.scrollTo(0,0);
}

const navEl = document.getElementById('nav');
navEl.innerHTML = NAV.map(item=>{
  if(item.group) return `<div class="nav-group-label">${item.group}</div>`;
  return `<button class="nav-item${item.id==='overview'?' active':''}" data-id="${item.id}" onclick="go('${item.id}')">${icon(item.id)}<span>${item.label}</span></button>`;
}).join('');

go('overview');
</script>
</body>
</html>
